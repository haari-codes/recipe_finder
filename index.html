
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder | Haari Codes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>🍃 Recipe Finder</h1>
        <select id="languageSelect" aria-label="Choose language">
            <option value="en">English</option>
            <option value="ml">മലയാളം</option>
            <option value="hi">हिन्दी</option>
            <option value="ta">தமிழ்</option>
        </select>
    </header>

    <main>
        <section class="search-section">
            <h2>Discover Your Next Favourite Meal</h2>
            <p>What would you love to eat today?</p>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search food... e.g. Biriyani, Pizza"
                >
                <button id="searchBtn">Search</button>
            </div>

            <button id="exploreToggle" class="link-button" type="button">
                Don't know what to cook? Explore recipes ↓
            </button>
        </section>

        <section id="filterSection" class="filter-section" hidden>
            <h2>Explore Recipes</h2>

            <label for="foodType">Food Type</label>
            <select id="foodType">
                <option value="">Any</option>
                <option value="Vegetarian">Vegetarian</option>
                <option value="Chicken">Chicken</option>
                <option value="Beef">Beef</option>
                <option value="Paneer">Paneer</option>
                <option value="Seafood">Seafood</option>
            </select>

            <label for="flavour">Flavour</label>
            <select id="flavour">
                <option value="">Any</option>
                <option value="Sweet">Sweet</option>
                <option value="Spicy">Spicy</option>
                <option value="Crispy">Crispy</option>
                <option value="Sour">Sour</option>
            </select>

            <label for="mealTime">Meal Time</label>
            <select id="mealTime">
                <option value="">Any</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
                <option value="Snacks">Snacks</option>
            </select>

            <label for="foodCategory">Food Category</label>
            <select id="foodCategory">
                <option value="">Any</option>
                <option value="Juices">Juices</option>
                <option value="Dessert">Desserts</option>
                <option value="Biriyani">Biriyani</option>
                <option value="Curry">Curry</option>
                <option value="Pasta">Pasta</option>
                <option value="Seafood">Seafood</option>
            </select>

            <button id="filterSubmit">Submit</button>
        </section>

        <section class="recipes">
            <h2 id="resultsHeading">Recipes</h2>
            <div id="recipeContainer" class="recipe-grid"></div>
        </section>

        <section id="recipeDetails" hidden></section>
    </main>

    <footer>
        <p>Made with ❤️ by Haari_Codes</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
